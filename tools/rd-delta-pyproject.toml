[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rd-delta"
version = "0.1.0"
description = "Red Dragon: a redshift-evolving Gaussian mixture model for galaxies"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "William K. Black", email = "wkblack@byu.edu" }]
keywords = ["astronomy", "gaussian-mixture-model", "photometric-redshift"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Astronomy",
]

# numpy>=2.0 is a hard floor: the code calls np.trapezoid, which was
# introduced in numpy 2.0 (it replaced the now-deprecated np.trapz).
dependencies = [
  "numpy>=2.0",
  "scipy>=1.7",
  "h5py>=3.0",
  "matplotlib>=3.5",
  "pygmmis>=1.2.2",
]

[project.optional-dependencies]
# Needed only by the catalogue-conversion / plotting drivers under scripts/.
scripts = ["pandas>=1.3"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/wkblack/red-dragon-delta"
Paper = "https://doi.org/10.1093/mnras/stac2052"

[tool.setuptools]
packages = ["rd_delta"]

[tool.pytest.ini_options]
# Only test_posterior_computation.py is an automated suite; test_main.py is an
# interactive, plot-producing scratchpad and is excluded by this pattern.
python_files = ["test_posterior_computation.py"]
testpaths = ["scripts"]
